name: k8s
adopt-info: kubernetes-version
summary: Canonical Kubernetes, a CNCF-conformant K8s distribution by Canonical
description: |-
  Canonical Kubernetes is an opinionated and CNCF conformant Kubernetes delivered by snaps.
  Enjoy the simplified, almost zero, operations and enhanced security posture
  on any infrastructure
license: GPL-3.0
grade: stable
confinement: strict
# Note(ben): Snapcraft does not expose its base for part builds, so we need to set it manually.
# Feature request tracked in https://github.com/canonical/snapcraft/issues/5614
# For now, remember to also update OPENSSL_MODULES and etcd part BASE when bumping this version.
base: core22
environment:
  REAL_PATH: $PATH
  REAL_LD_LIBRARY_PATH: $LD_LIBRARY_PATH
  CRAFT_ARCH_TRIPLET_BUILD_FOR: $CRAFT_ARCH_TRIPLET_BUILD_FOR
  # Note(ben): Needs to be changed to /snap/core24/current/usr/lib/x86_64-linux-gnu/ossl-modules/
  # when base is updated to core24 (mind the removed "-3").
  OPENSSL_MODULES: /snap/core22/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ossl-modules-3/

architectures:
  - build-on: [amd64]
  - build-on: [arm64]
  - build-on: [ppc64el]
  - build-on: [s390x]

parts:
  build-deps:
    plugin: nil
    build-snaps:
      - go/1.26-fips/stable
    build-attributes: [no-patchelf]
    build-packages:
      - sudo
      - autoconf
      - automake
      - autopoint
      - autotools-dev
      - bison
      - btrfs-progs
      - libbtrfs-dev
      - build-essential
      - curl
      - flex
      - git
      - libjansson-dev
      - liblz4-dev
      - libnetfilter-conntrack-dev
      - libnetfilter-conntrack3
      - libnfnetlink-dev
      - libseccomp-dev
      - libtool
      - libssl-dev
      - patchelf
      - pkg-config
      - rsync
      - tcl
      - python3-pip

  etcd:
    plugin: nil
    after: [build-deps]
    source: build-scripts/components/etcd
    build-environment:
    - BASE: core22  # Note: This field must match the base field above.
    - BIN: $CRAFT_STAGE/bin/etcd
    override-build: $CRAFT_PROJECT_DIR/build-scripts/build-component.sh etcd
    build-attributes: [no-patchelf]

  k8sd:
    after: [build-deps]
    source: build-scripts/components/k8sd
    build-attributes: [no-patchelf]
    plugin: nil
    override-build: $CRAFT_PROJECT_DIR/build-scripts/build-component.sh k8sd

  cni:
    after: [build-deps]
    plugin: nil
    source: build-scripts/components/cni
    build-attributes: [no-patchelf]
    override-build: $CRAFT_PROJECT_DIR/build-scripts/build-component.sh cni

  kubernetes:
    after: [build-deps]
    plugin: nil
    source: build-scripts
    build-attributes: [no-patchelf]
    override-build: $CRAFT_PROJECT_DIR/build-scripts/build-component.sh kubernetes

  kubernetes-version:
    plugin: nil
    source: build-scripts/components/kubernetes
    override-build: craftctl set version="$(cat ./version)"

  helm:
    after: [build-deps]
    build-attributes: [no-patchelf]
    plugin: nil
    source: build-scripts/components/helm
    override-build: $CRAFT_PROJECT_DIR/build-scripts/build-component.sh helm

  libmnl:
    after: [build-deps]
    plugin: autotools
    source: https://www.netfilter.org/pub/libmnl/libmnl-1.0.4.tar.bz2
    build-attributes: [no-patchelf]
    prime:
      - -usr/local/include

  libnftnl:
    after: [libmnl]
    plugin: autotools
    source: https://www.netfilter.org/projects/libnftnl/files/libnftnl-1.1.8.tar.bz2
    build-attributes: [no-patchelf]
    build-environment:
      - LIBMNL_LIBS: $CRAFT_STAGE/usr/lib
    prime:
      - -usr/local/include

  iptables:
    after: [libnftnl]
    source: https://www.netfilter.org/projects/iptables/files/iptables-1.8.6.tar.bz2
    plugin: autotools
    build-attributes: [no-patchelf]
    build-environment:
      - LIBMNL_LIBS: $CRAFT_STAGE/usr/lib
      - LIBNFTNL_LIBS: $CRAFT_STAGE/usr/lib
    autotools-configure-parameters:
      - "--prefix=/usr"
      - "--exec-prefix=/"
      - "--disable-shared"
      - "--enable-static"
    stage:
      - -usr
      - -lib/pkgconfig
      - -bin/iptables-xml

  containerd:
    after: [runc]
    plugin: nil
    source: build-scripts/components/containerd
    override-build: $CRAFT_PROJECT_DIR/build-scripts/build-component.sh containerd
    build-environment:
    - BASE: core22  # Note: This field must match the base field above.
    build-attributes: [no-patchelf]

  runc:
    after: [iptables, build-deps]
    plugin: nil
    build-attributes: [no-patchelf]
    source: build-scripts/components/runc
    override-build: $CRAFT_PROJECT_DIR/build-scripts/build-component.sh runc

  bash-utils:
    plugin: nil
    build-attributes: [no-patchelf]
    stage-packages:
      - conntrack
      - coreutils
      - diffutils
      - erofs-utils
      - ethtool
      - hostname
      - iproute2
      - ipset
      - kmod
      - libatm1
      - libnss-resolve
      - libnss-myhostname
      - libnss-mymachines
      - members
      - nano
      - net-tools
      - openssl
      - procps
      - tar
      # k8sd reads service state through systemctl. Strict apps cannot execute
      # the host binary; its read-only D-Bus access uses system-observe below.
      - systemd
      - util-linux
    stage:
      # Use the Core base journalctl with its matching private systemd library.
      # Only the staged systemctl client is needed for daemon service queries.
      - -bin/journalctl
      - -usr/bin/journalctl
      - -etc/bash_completion.d
      - -etc/cron.d
      - -etc/depmod.d
      - -etc/ldap
      - -etc/logrotate.d
      - -etc/init.d
      - -etc/perl
      - -etc/rsyslog.d
      - -etc/sudoers.d
      - -lib/systemd
      - -usr/bin/perl*
      - -usr/include
      - -usr/lib/*/*perl*
      - -usr/share

  k8s:
    plugin: nil
    source: k8s
    build-attributes: [no-patchelf]
    override-build: |
      rm $CRAFT_PART_INSTALL/k8s -rf
      cp --archive --link --no-dereference . $CRAFT_PART_INSTALL/k8s

  bom:
    after:
      - cni
      - containerd
      - etcd
      - helm
      - k8sd
      - kubernetes
      - runc
    plugin: nil
    source: .
    build-packages:
      - python3-yaml
    override-build: |
      ./build-scripts/generate-bom.py > "${CRAFT_PART_INSTALL}/bom.json"

  resources:
    plugin: dump
    source: k8s/resources
    source-type: local
    organize:
      "*": etc/
    stage:
      - etc/

apps:
  k8s:
    command: k8s/wrappers/commands/k8s
    plugs:
      - firewall-control
      - home-read-all
      - home
      - kernel-module-observe
      - kubernetes-support
      - login-session-observe
      - log-observe
      - mount-observe
      - network
      - network-bind
      - network-control
      - network-observe
      - opengl
      - system-observe
  containerd:
    command: k8s/wrappers/services/containerd
    daemon: notify
    install-mode: disable
    # when stopped send only sigterm
    # https://forum.snapcraft.io/t/process-lifecycle-on-snap-refresh/140/37
    stop-mode: sigterm
    restart-condition: always
    start-timeout: 5m
    before: [kubelet]
    plugs:
      - cifs-mount
      - cilium-delete-queue-lock
      - cilium-module-load
      - docker-privileged
      - firewall-control
      - fuse-support
      - kernel-crypto-api
      - kubernetes-support
      - mount-observe
      - network-bind
      - network-control
      - opengl
  etcd:
    command: k8s/wrappers/services/etcd
    install-mode: disable
    daemon: simple
    before: [kube-apiserver]
    plugs:
      - network-bind
  k8sd:
    command: k8s/wrappers/services/k8sd
    install-mode: enable
    daemon: simple
    environment:
      # A snap mount namespace is not a systemd chroot. Query the host manager
      # through the read-only system-observe D-Bus policy.
      SYSTEMD_IGNORE_CHROOT: "1"
    plugs:
      - k8sd-host-files
      - kubernetes-support
      - mount-observe
      - network
      - network-bind
      - system-observe
  kubelet:
    install-mode: disable
    command: k8s/wrappers/services/kubelet
    daemon: simple
    after: [containerd]
    plugs:
      - docker-privileged
      - firewall-control
      - hardware-observe
      - kernel-module-observe
      - kubernetes-support
      - mount-observe
      - network-bind
      - network-control
      - network-observe
      - opengl
      - process-control
      - system-observe
  kube-apiserver:
    install-mode: disable
    command: k8s/wrappers/services/kube-apiserver
    daemon: simple
    before: [kubelet, kube-controller-manager, kube-proxy, kube-scheduler]
    stop-timeout: 5s
    # Plain network daemons: no container, mount or firewall privileges.
    plugs:
      - network
      - network-bind
      - network-observe
      - system-observe
  kube-controller-manager:
    install-mode: disable
    command: k8s/wrappers/services/kube-controller-manager
    daemon: simple
    after: [kube-apiserver]
    # Plain network daemons: no container, mount or firewall privileges.
    plugs:
      - network
      - network-bind
      - network-observe
      - system-observe
  kube-proxy:
    install-mode: disable
    command: k8s/wrappers/services/kube-proxy
    daemon: simple
    after: [kube-apiserver]
    plugs:
      - docker-privileged
      - firewall-control
      - hardware-observe
      - kernel-module-observe
      - kubernetes-support
      - mount-observe
      - network-bind
      - network-control
      - network-observe
      - opengl
      - process-control
      - system-observe
  kube-scheduler:
    install-mode: disable
    command: k8s/wrappers/services/kube-scheduler
    daemon: simple
    after: [kube-apiserver]
    # Plain network daemons: no container, mount or firewall privileges.
    plugs:
      - network
      - network-bind
      - network-observe
      - system-observe
  k8s-apiserver-proxy:
    install-mode: disable
    command: k8s/wrappers/services/k8s-apiserver-proxy
    daemon: simple
    before: [kubelet, kube-proxy]
    plugs:
      - network-bind

layout:
  # Kubernetes paths
  /etc/kubernetes:
    bind: $SNAP_COMMON/etc/kubernetes
  /etc/cni/net.d:
    bind: $SNAP_COMMON/etc/cni/net.d
  /opt/cni/bin:
    bind: $SNAP_COMMON/opt/cni/bin
  /var/lib/kubelet:
    bind: $SNAP_COMMON/var/lib/kubelet
  # Logs and temporary files
  /var/log/pods:
    bind: $SNAP_COMMON/var/log/pods
  /var/log/containers:
    bind: $SNAP_COMMON/var/log/containers
  # CNI and compatibility paths.
  /var/lib/cni:
    bind: $SNAP_COMMON/var/lib/cni
  /usr/libexec:
    bind: $SNAP_COMMON/usr/libexec
  /var/lib/kube-proxy:
    bind: $SNAP_COMMON/var/lib/kube-proxy
  /etc/nanorc:
    bind-file: $SNAP_COMMON/etc/nanorc

plugs:
  home-read-all:
    interface: home
    read: all
  docker-privileged:
    interface: docker-support
    privileged-containers: true
  # WORKAROUND, needs engineering review: exact paths k8sd was denied on
  # UC22/UC24. Not a design; each entry is a k8sd behaviour to fix upstream.
  #  - /run/systemd/private: k8sd polls service state via systemctl. This
  #    effectively grants systemd manager access; replace with a /proc or
  #    snapctl based lookup in k8sd.
  #  - /run/xtables.lock, /etc/iproute2: the node-configuration controller
  #    runs 'kube-proxy --cleanup' (iptables) on every reconcile, although
  #    kube-proxy is disabled. iptables will still lack net_admin.
  #  - /etc/modprobe.d: modprobe reads its configuration directory.
  k8sd-host-files:
    interface: system-files
    read:
      - /etc/iproute2
      - /etc/modprobe.d
    write:
      - /run/systemd/private
      - /run/xtables.lock
  # Cilium CNI locks the host delete queue when it cannot reach the agent.
  cilium-delete-queue-lock:
    interface: system-files
    write:
      - /run/cilium/deleteQueue/lockfile
  # The remove hook runs Cilium's own teardown after stopping its containers.
  cilium-cleanup:
    interface: system-files
    read:
      - /sys/fs/bpf
    write:
      - /run/cilium
      - /var/lib/cilium
      - /sys/fs/bpf/cilium
      - /sys/fs/bpf/tc/globals
  # Cilium Ingress requires iptable_raw and xt_socket for datapath L7 redirection.
  cilium-module-load:
    interface: kernel-module-load
    modules:
      - name: iptable_raw
        load: "on-boot"
      - name: xt_socket
        load: "on-boot"

hooks:
  remove:
    plugs:
      - cilium-cleanup
      - kubernetes-support
      - network
      - network-bind
      - network-control
      - network-observe
      - process-control
      - firewall-control
      - system-observe
      - mount-observe
